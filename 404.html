<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opera Avenue Hotel</title>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var routes = ["about", "rooms", "offers", "terrace", "dining", "celebrations", "experiences", "gallery", "practical", "contacts", "booking"];
      var base = "/";
      var rest = location.pathname || "/";
      if (parts.length && routes.indexOf(parts[0]) === -1 && parts[0] !== "index.html") {
        base = "/" + parts[0] + "/";
        rest = location.pathname.slice(base.length - 1) || "/";
      }
      if (rest.charAt(0) !== "/") rest = "/" + rest;
      location.replace(base + "#" + rest + location.search);
    })();
  </script>
</head>
<body>
  <p><a href="./">Opera Avenue Hotel</a></p>
</body>
</html>
